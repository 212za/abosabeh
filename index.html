<!doctype html>
<html lang="ar" dir="rtl" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أبو صبيح - ABOSABEH</title>
    
    <!-- خطوط جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-dark': '#2d3a2e',
              'brand-green': '#3d5a3e',
              'brand-cream': '#faf8f5',
            },
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

      window.firebaseConfig = {
        apiKey: "AIzaSyBMpZ7CXOJbgKpMqOjzsbbCcpHBlslU3mw",
        authDomain: "salah-52496.firebaseapp.com",
        databaseURL: "https://salah-52496-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "salah-52496",
        storageBucket: "salah-52496.firebasestorage.app",
        messagingSenderId: "235427387836",
        appId: "1:235427387836:web:5ad91f888f013bb603f3b9",
        measurementId: "G-MK9QC8X5QQ"
      };

      window.app = initializeApp(window.firebaseConfig);
      window.auth = getAuth(window.app);
      window.db = getDatabase(window.app);
      window.GoogleAuthProvider = GoogleAuthProvider;
      window.signInWithPopup = signInWithPopup;
      window.signOut = signOut;
      window.onAuthStateChanged = onAuthStateChanged;
      window.dbRef = ref;
      window.dbSet = set;
      window.dbPush = push;
      window.dbOnValue = onValue;
      window.dbUpdate = update;
      window.dbRemove = remove;
      
      window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
      body { font-family: 'Cairo', sans-serif; background-color: #faf8f5; color: #2d3a2e; }
    </style>
  </head>
  <body class="bg-[#faf8f5] min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const translations = {
        ar: {
          brand: "أبو صبيح",
          solutions: "المعدات",
          plans: "المبيعات",
          news: "خدمة العملاء",
          login: "تسجيل الدخول بـ Google",
          logout: "خروج",
          adminPanel: "لوحة الأدمن",
          storePickup: "استلام من المتجر",
          delivery: "توصيل للمنزل",
          price: "السعر",
          deliveryFee: "رسوم التوصيل",
          buyNow: "عرض التفاصيل والطلب",
          chatWithAdmin: "محادثة الأدمن",
          statusAvailable: "متوفر",
          statusSold: "تم البيع",
          send: "إرسال",
          typeMessage: "اكتب رسلتك أو ارفق رابط السكرين شوت هنا...",
          settings: "الإعدادات وروابط التواصل",
          products: "المنتجات والمعدات",
          sales: "المبيعات والطلبات",
          save: "حفظ",
          cancel: "إلغاء",
          addProduct: "إضافة معدة/منتج جديد",
          productName: "اسم المنتج",
          productDesc: "الوصف (اختياري)",
          productPrice: "السعر الأساسي",
          images: "روابط الصور (من 1 إلى 4 صور)",
        },
        en: {
          brand: "ABOSABEH",
          solutions: "Equipment",
          plans: "Sales",
          news: "Customer Service",
          login: "Sign in with Google",
          logout: "Logout",
          adminPanel: "Admin Panel",
          storePickup: "Store Pickup",
          delivery: "Home Delivery",
          price: "Price",
          deliveryFee: "Delivery Fee",
          buyNow: "View Details & Order",
          chatWithAdmin: "Chat with Admin",
          statusAvailable: "Available",
          statusSold: "Sold Out",
          send: "Send",
          typeMessage: "Type your message or paste screenshot link...",
          settings: "Settings & Social Links",
          products: "Products & Equipment",
          sales: "Sales & Orders",
          save: "Save",
          cancel: "Cancel",
          addProduct: "Add New Product",
          productName: "Product Name",
          productDesc: "Description (Optional)",
          productPrice: "Base Price",
          images: "Image URLs (1 to 4 images)",
        }
      };

      function App() {
        const [lang, setLang] = useState('ar');
        const [user, setUser] = useState(null);
        const [isAdmin, setIsAdmin] = useState(false);
        const [currentView, setCurrentView] = useState('shop');
        
        const [products, setProducts] = useState({});
        const [settings, setSettings] = useState({ deliveryFee: 50, whatsapp: '', facebook: '' });
        const [orders, setOrders] = useState({});
        
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [activeImageIndex, setActiveImageIndex] = useState(0);
        const [orderType, setOrderType] = useState('pickup');

        const adminEmails = ["salah@gmail.com", "abosabeh@gmail.com"];

        useEffect(() => {
          const checkFirebase = setInterval(() => {
            if (window.auth) {
              clearInterval(checkFirebase);
              window.onAuthStateChanged(window.auth, (u) => {
                if (u) {
                  setUser(u);
                  if (adminEmails.includes(u.email) || u.email.includes("admin")) {
                    setIsAdmin(true);
                  }
                } else {
                  setUser(null);
                  setIsAdmin(false);
                }
              });

              window.dbOnValue(window.dbRef(window.db, 'products'), (snapshot) => {
                setProducts(snapshot.val() || {});
              });

              window.dbOnValue(window.dbRef(window.db, 'settings'), (snapshot) => {
                setSettings(snapshot.val() || { deliveryFee: 50, whatsapp: '', facebook: '' });
              });

              window.dbOnValue(window.dbRef(window.db, 'orders'), (snapshot) => {
                setOrders(snapshot.val() || {});
              });
            }
          }, 500);
        }, []);

        const loginWithGoogle = async () => {
          try {
            const provider = new window.GoogleAuthProvider();
            await window.signInWithPopup(window.auth, provider);
          } catch (error) {
            console.error(error);
            alert("خطأ في تسجيل الدخول: " + error.message);
          }
        };

        const logout = async () => {
          await window.signOut(window.auth);
          setCurrentView('shop');
        };

        const scrollToSales = () => {
          setCurrentView('shop');
          setTimeout(() => {
            const element = document.getElementById('sales-section');
            if (element) {
              element.scrollIntoView({ behavior: 'smooth' });
            }
          }, 100);
        };

        const t = translations[lang];

        return (
          <div className="min-h-screen bg-[#faf8f5] text-[#2d3a2e]" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
            {/* شريط التنقل العلوي */}
            <header className="fixed top-0 left-0 right-0 z-50 bg-[#faf8f5]/90 backdrop-blur-md shadow-sm">
              <div className="max-w-7xl mx-auto px-6 lg:px-8">
                <div className="relative flex items-center h-16 md:h-20 justify-between">
                  
                  <nav className="hidden md:flex items-center gap-8">
                    <button
                      onClick={() => setCurrentView('shop')}
                      className="text-sm text-[#2d3a2e] tracking-wide uppercase hover:opacity-70 transition-opacity font-bold cursor-pointer"
                    >
                      {t.solutions}
                    </button>
                    <button
                      onClick={scrollToSales}
                      className="text-sm text-[#2d3a2e] tracking-wide uppercase hover:opacity-70 transition-opacity font-bold cursor-pointer"
                    >
                      {t.plans}
                    </button>
                    <button
                      onClick={() => user ? setCurrentView('chat') : alert('يرجى تسجيل الدخول أولاً')}
                      className="text-sm text-[#2d3a2e] tracking-wide uppercase hover:opacity-70 transition-opacity font-bold cursor-pointer"
                    >
                      {t.news}
                    </button>
                  </nav>

                  <div 
                    onClick={() => setCurrentView('shop')}
                    className="absolute left-1/2 -translate-x-1/2 flex items-center gap-2 select-none cursor-pointer"
                  >
                    <span className="text-xl text-[#2d3a2e] font-bold">&#9650;</span>
                    <span className="text-xl text-[#2d3a2e] tracking-tight font-medium">
                      {t.brand}
                    </span>
                  </div>

                  <div className="flex items-center gap-3">
                    <button 
                      onClick={() => {
                        const newLang = lang === 'ar' ? 'en' : 'ar';
                        setLang(newLang);
                        document.getElementById('html-root').setAttribute('dir', newLang === 'ar' ? 'rtl' : 'ltr');
                      }}
                      className="px-3 py-1.5 text-xs bg-white border border-[#2d3a2e]/20 hover:bg-slate-100 rounded-full font-bold"
                    >
                      {lang === 'ar' ? 'English' : 'العربية'}
                    </button>

                    {settings.whatsapp && (
                      <a href={settings.whatsapp} target="_blank" className="text-green-700 font-bold text-xs hidden sm:inline">WhatsApp</a>
                    )}
                    {settings.facebook && (
                      <a href={settings.facebook} target="_blank" className="text-blue-700 font-bold text-xs hidden sm:inline">Facebook</a>
                    )}

                    {user ? (
                      <div className="flex items-center gap-2">
                        {isAdmin && (
                          <button 
                            onClick={() => setCurrentView(currentView === 'admin' ? 'shop' : 'admin')}
                            className="bg-[#2d3a2e] text-white px-3 py-1.5 rounded-full text-xs font-bold hover:bg-[#3d5a3e]"
                          >
                            {currentView === 'admin' ? t.solutions : t.adminPanel}
                          </button>
                        )}
                        <button 
                          onClick={() => setCurrentView('chat')}
                          className="bg-amber-700 text-white px-3 py-1.5 rounded-full text-xs font-bold"
                        >
                          {t.chatWithAdmin}
                        </button>
                        <button onClick={logout} className="text-red-600 text-xs font-bold">
                          {t.logout}
                        </button>
                      </div>
                    ) : (
                      <button 
                        onClick={loginWithGoogle}
                        className="bg-[#2d3a2e] text-white px-4 py-2 rounded-full text-xs font-semibold hover:bg-[#3d5a3e]"
                      >
                        {t.login}
                      </button>
                    )}
                  </div>

                </div>
              </div>
            </header>

            {/* المحتوى الرئيسي */}
            <main className="pt-24 pb-12 max-w-7xl mx-auto px-6 lg:px-8">
              {currentView === 'shop' && (
                <div>
                  <section className="relative w-full py-16 text-center md:text-start flex flex-col items-center md:items-start justify-center">
                    <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-[#2d3a2e]/15 bg-white/60 backdrop-blur-sm mb-6">
                      <span className="text-xs font-bold text-[#2d3a2e]">
                        {lang === 'ar' ? 'مرحباً بك في منصة أبو صبيح للمعدات والأجهزة المتكاملة' : 'Welcome to Abosabeh Equipment Store'}
                      </span>
                    </div>
                    <h1 className="text-3xl sm:text-4xl md:text-5xl text-[#2d3a2e] leading-tight font-bold max-w-3xl mb-8">
                      {lang === 'ar' ? 'المتجر الأول لبيع المعدات والأجهزة مع خدمة التوصيل والشات المباشر' : 'The ultimate store for equipment with delivery & direct chat'}
                    </h1>
                    
                    <button
                      onClick={scrollToSales}
                      className="inline-flex items-center gap-2 px-6 py-3 bg-[#2d3a2e] text-white text-sm font-bold rounded-full hover:bg-[#3d5a3e] transition-colors shadow-sm"
                    >
                      {lang === 'ar' ? 'انتقل إلى المبيعات والمعروضات 👇' : 'Go to Sales & Equipment 👇'}
                    </button>
                  </section>

                  <div id="sales-section" className="mt-12 pt-8 border-t border-[#2d3a2e]/10">
                    <h2 className="text-2xl font-bold text-[#2d3a2e] mb-6">
                      {lang === 'ar' ? 'المعدات والمعروضات المتاحة للبيع' : 'Available Equipment & Sales'}
                    </h2>
                    
                    <ShopView 
                      products={products} 
                      settings={settings} 
                      lang={lang} 
                      onSelectProduct={(p) => { setSelectedProduct(p); setActiveImageIndex(0); }} 
                    />
                  </div>
                </div>
              )}

              {currentView === 'admin' && isAdmin && (
                <AdminPanel lang={lang} settings={settings} products={products} orders={orders} />
              )}

              {currentView === 'chat' && user && (
                <ChatView user={user} lang={lang} />
              )}
            </main>

            {selectedProduct && (
              <ProductModal 
                product={selectedProduct} 
                settings={settings}
                lang={lang}
                activeImageIndex={activeImageIndex}
                setActiveImageIndex={setActiveImageIndex}
                orderType={orderType}
                setOrderType={setOrderType}
                onClose={() => setSelectedProduct(null)}
                user={user}
                onOpenChat={() => {
                  setSelectedProduct(null);
                  setCurrentView('chat');
                }}
              />
            )}
          </div>
        );
      }

      function ShopView({ products, settings, lang, onSelectProduct }) {
        const productList = Object.keys(products).map(key => ({ id: key, ...products[key] }));

        return (
          <div>
            {productList.length === 0 ? (
              <div className="text-center py-16 bg-white/50 rounded-2xl border border-[#2d3a2e]/10">
                <p className="text-[#2d3a2e]/60 text-base font-semibold">
                  {lang === 'ar' ? 'لا توجد معدات معروضة حالياً.' : 'No equipment available right now.'}
                </p>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {productList.map(item => {
                  const images = item.images || [item.image || 'https://via.placeholder.com/400'];
                  const isSold = item.status === 'sold';
                  
                  return (
                    <div key={item.id} className="bg-white rounded-2xl shadow-sm border border-[#2d3a2e]/10 overflow-hidden flex flex-col justify-between">
                      <div>
                        <div className="relative h-52 bg-slate-100 overflow-hidden">
                          <img src={images[0]} alt={item.name} className="w-full h-full object-cover" />
                          {isSold ? (
                            <span className="absolute top-3 right-3 bg-red-600 text-white text-xs px-3 py-1 rounded-full font-bold">
                              {lang === 'ar' ? 'تم البيع' : 'Sold Out'}
                            </span>
                          ) : (
                            <span className="absolute top-3 right-3 bg-[#3d5a3e] text-white text-xs px-3 py-1 rounded-full font-bold">
                              {lang === 'ar' ? 'متوفر' : 'Available'}
                            </span>
                          )}
                        </div>
                        <div className="p-4">
                          <h3 className="text-lg font-bold text-[#2d3a2e] mb-1">{item.name}</h3>
                          {item.description && (
                            <p className="text-[#2d3a2e]/70 text-xs line-clamp-2 mb-3">{item.description}</p>
                          )}
                          <div className="text-xl font-bold text-[#3d5a3e]">
                            {item.price} ج.م
                          </div>
                        </div>
                      </div>

                      <div className="p-4 pt-0">
                        <button
                          onClick={() => onSelectProduct(item)}
                          className="w-full bg-[#2d3a2e] text-white py-2.5 rounded-xl text-xs font-bold hover:bg-[#3d5a3e] transition-colors"
                        >
                          {lang === 'ar' ? 'عرض التفاصيل والطلب' : 'View Details & Order'}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      }

      function ProductModal({ product, settings, lang, activeImageIndex, setActiveImageIndex, orderType, setOrderType, onClose, user, onOpenChat }) {
        const images = product.images || [product.image || 'https://via.placeholder.com/400'];
        const deliveryFee = Number(settings.deliveryFee || 50);
        const totalPrice = orderType === 'delivery' ? Number(product.price) + deliveryFee : Number(product.price);

        return (
          <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div className="bg-white rounded-3xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-6 relative">
              <button onClick={onClose} className="absolute top-4 left-4 bg-slate-100 w-8 h-8 rounded-full font-bold text-slate-700">✕</button>

              <div className="mb-4">
                <div className="h-64 bg-slate-100 rounded-2xl overflow-hidden mb-2">
                  <img src={images[activeImageIndex]} alt="" className="w-full h-full object-cover" />
                </div>
                {images.length > 1 && (
                  <div className="flex gap-2">
                    {images.map((img, idx) => (
                      <button key={idx} onClick={() => setActiveImageIndex(idx)} className={`w-14 h-14 rounded-lg overflow-hidden border-2 ${activeImageIndex === idx ? 'border-[#3d5a3e]' : 'border-transparent'}`}>
                        <img src={img} alt="" className="w-full h-full object-cover" />
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <h2 className="text-2xl font-bold text-[#2d3a2e] mb-2">{product.name}</h2>
              {product.description && <p className="text-slate-600 text-sm mb-4">{product.description}</p>}

              <div className="bg-slate-50 p-4 rounded-2xl mb-6">
                <label className="block text-xs font-bold text-slate-700 mb-2">طريقة الاستلام أو التوصيل:</label>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => setOrderType('pickup')} className={`p-3 rounded-xl border text-xs font-bold ${orderType === 'pickup' ? 'border-[#3d5a3e] bg-[#3d5a3e]/10 text-[#2d3a2e]' : 'border-slate-200'}`}>
                    استلام من المتجر ({product.price} ج.م)
                  </button>
                  <button onClick={() => setOrderType('delivery')} className={`p-3 rounded-xl border text-xs font-bold ${orderType === 'delivery' ? 'border-[#3d5a3e] bg-[#3d5a3e]/10 text-[#2d3a2e]' : 'border-slate-200'}`}>
                    توصيل للمنزل (+{deliveryFee} ج.م)
                  </button>
                </div>
              </div>

              <div className="flex justify-between items-center mb-6">
                <span className="text-sm font-bold text-slate-600">الإجمالي النهائي:</span>
                <span className="text-2xl font-bold text-[#3d5a3e]">{totalPrice} ج.م</span>
              </div>

              {user ? (
                <button onClick={onOpenChat} className="w-full bg-[#2d3a2e] text-white py-3 rounded-xl font-bold text-sm hover:bg-[#3d5a3e]">
                  {lang === 'ar' ? 'انتقل للشات لإرسال السكرين شوت وتأكيد الطلب' : 'Go to Chat to Send Screenshot & Confirm'}
                </button>
              ) : (
                <p className="text-center text-xs text-red-600 font-bold bg-red-50 p-3 rounded-xl">يرجى تسجيل الدخول أولاً لإتمام الطلب والمراسلة.</p>
              )}
            </div>
          </div>
        );
      }

      function ChatView({ user, lang }) {
        const [messages, setMessages] = useState([]);
        const [text, setText] = useState('');

        useEffect(() => {
          const chatRef = window.dbRef(window.db, `chats/${user.uid}`);
          window.dbOnValue(chatRef, (snapshot) => {
            const data = snapshot.val() || {};
            setMessages(Object.keys(data).map(k => ({ id: k, ...data[k] })));
          });
        }, [user.uid]);

        const sendMessage = (e) => {
          e.preventDefault();
          if (!text.trim()) return;
          window.dbPush(window.dbRef(window.db, `chats/${user.uid}`), {
            sender: user.uid,
            senderName: user.displayName || 'عميل',
            text,
            timestamp: Date.now()
          });
          setText('');
        };

        return (
          <div className="bg-white rounded-3xl shadow-sm border border-slate-200 max-w-3xl mx-auto flex flex-col h-[70vh]">
            <div className="p-4 border-b bg-slate-50 rounded-t-3xl font-bold text-sm">محادثتك الخاصة مع إدارة أبو صبيح</div>
            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {messages.map(m => (
                <div key={m.id} className={`flex flex-col ${m.sender === user.uid ? 'items-end' : 'items-start'}`}>
                  <div className={`p-3 rounded-2xl text-xs max-w-[80%] ${m.sender === user.uid ? 'bg-[#2d3a2e] text-white' : 'bg-slate-100 text-slate-800'}`}>
                    {m.text}
                  </div>
                </div>
              ))}
            </div>
            <form onSubmit={sendMessage} className="p-3 border-t flex gap-2">
              <input type="text" value={text} onChange={e=>setText(e.target.value)} placeholder="اكتب رسلتك أو رابط السكرين شوت هنا..." className="flex-1 px-4 py-2 border rounded-xl text-xs" />
              <button type="submit" className="bg-[#2d3a2e] text-white px-5 py-2 rounded-xl text-xs font-bold">إرسال</button>
            </form>
          </div>
        );
      }

      function AdminPanel({ lang, settings, products, orders }) {
        const [activeTab, setActiveTab] = useState('products');
        const [name, setName] = useState('');
        const [desc, setDesc] = useState('');
        const [price, setPrice] = useState('');
        const [img1, setImg1] = useState('');
        const [img2, setImg2] = useState('');
        const [img3, setImg3] = useState('');
        const [img4, setImg4] = useState('');
        
        const [deliveryFeeInput, setDeliveryFeeInput] = useState(settings.deliveryFee || 50);
        const [whatsappInput, setWhatsappInput] = useState(settings.whatsapp || '');
        const [facebookInput, setFacebookInput] = useState(settings.facebook || '');
        
        const [allChats, setAllChats] = useState({});
        const [selectedChatUser, setSelectedChatUser] = useState(null);
        const [adminReply, setAdminReply] = useState('');

        useEffect(() => {
          window.dbOnValue(window.dbRef(window.db, 'chats'), (snapshot) => {
            setAllChats(snapshot.val() || {});
          });
        }, []);

        const addProduct = (e) => {
          e.preventDefault();
          if (!name || !price || !img1) return alert("أدخل الاسم والسعر وصورة واحدة على الأقل");
          window.dbPush(window.dbRef(window.db, 'products'), {
            name, description: desc, price: Number(price),
            images: [img1, img2, img3, img4].filter(Boolean),
            status: 'available', createdAt: Date.now()
          });
          setName(''); setDesc(''); setPrice(''); setImg1(''); setImg2(''); setImg3(''); setImg4('');
          alert("تم إضافة المنتج بنجاح!");
        };

        const toggleStatus = (id, currentStatus) => {
          window.dbUpdate(window.dbRef(window.db, `products/${id}`), { status: currentStatus === 'sold' ? 'available' : 'sold' });
        };

        const deleteProduct = (id) => {
          if (confirm("هل تريد حذف هذا المنتج؟")) window.dbRemove(window.dbRef(window.db, `products/${id}`));
        };

        const saveSettings = (e) => {
          e.preventDefault();
          window.dbSet(window.dbRef(window.db, 'settings'), {
            deliveryFee: Number(deliveryFeeInput),
            whatsapp: whatsappInput,
            facebook: facebookInput
          });
          alert("تم حفظ الإعدادات!");
        };

        const sendAdminMessage = (e) => {
          e.preventDefault();
          if (!adminReply.trim() || !selectedChatUser) return;
          window.dbPush(window.dbRef(window.db, `chats/${selectedChatUser}`), {
            sender: 'admin', senderName: 'الأدمن', text: adminReply, timestamp: Date.now()
          });
          setAdminReply('');
        };

        return (
          <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
            <div className="flex gap-3 mb-6 border-b pb-4">
              <button onClick={() => setActiveTab('products')} className={`px-4 py-2 rounded-xl text-xs font-bold ${activeTab === 'products' ? 'bg-[#2d3a2e] text-white' : 'bg-slate-100'}`}>إدارة المنتجات</button>
              <button onClick={() => setActiveTab('chats')} className={`px-4 py-2 rounded-xl text-xs font-bold ${activeTab === 'chats' ? 'bg-[#2d3a2e] text-white' : 'bg-slate-100'}`}>محادثات العملاء</button>
              <button onClick={() => setActiveTab('settings')} className={`px-4 py-2 rounded-xl text-xs font-bold ${activeTab === 'settings' ? 'bg-[#2d3a2e] text-white' : 'bg-slate-100'}`}>الإعدادات والتوصيل</button>
            </div>

            {activeTab === 'products' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <form onSubmit={addProduct} className="bg-slate-50 p-4 rounded-2xl space-y-3">
                  <h3 className="font-bold text-xs">إضافة منتج جديد</h3>
                  <input type="text" placeholder="اسم المنتج" value={name} onChange={e=>setName(e.target.value)} className="w-full p-2 border rounded-xl text-xs" />
                  <textarea placeholder="الوصف (اختياري)" value={desc} onChange={e=>setDesc(e.target.value)} className="w-full p-2 border rounded-xl text-xs" rows="2" />
                  <input type="number" placeholder="السعر" value={price} onChange={e=>setPrice(e.target.value)} className="w-full p-2 border rounded-xl text-xs" />
                  <input type="text" placeholder="رابط الصورة 1 (إجباري)" value={img1} onChange={e=>setImg1(e.target.value)} className="w-full p-2 border rounded-xl text-xs" />
                  <input type="text" placeholder="رابط الصورة 2 (اختياري)" value={img2} onChange={e=>setImg2(e.target.value)} className="w-full p-2 border rounded-xl text-xs" />
                  <input type="text" placeholder="رابط الصورة 3 (اختياري)" value={img3} onChange={e=>setImg3(e.target.value)} className="w-full p-2 border rounded-xl text-xs" />
                  <input type="text" placeholder="رابط الصورة 4 (اختياري)" value={img4} onChange={e=>setImg4(e.target.value)} className="w-full p-2 border rounded-xl text-xs" />
                  <button type="submit" className="w-full bg-[#2d3a2e] text-white py-2 rounded-xl text-xs font-bold">إضافة للمتجر</button>
                </form>

                <div className="lg:col-span-2 space-y-3">
                  <h3 className="font-bold text-xs">المنتجات الحالية</h3>
                  {Object.keys(products).map(id => {
                    const p = products[id];
                    const isSold = p.status === 'sold';
                    return (
                      <div key={id} className="flex items-center justify-between p-3 border rounded-xl bg-white">
                        <div className="flex items-center gap-3">
                          <img src={p.images?.[0] || p.image} alt="" className="w-10 h-10 rounded object-cover" />
                          <div>
                            <div className="font-bold text-xs">{p.name}</div>
                            <div className="text-[10px] text-[#3d5a3e]">{p.price} ج.م</div>
                          </div>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => toggleStatus(id, p.status)} className={`px-2 py-1 rounded text-[10px] font-bold ${isSold ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>
                            {isSold ? 'مباع (اجعله متوفر)' : 'متوفر (اجعله مباع)'}
                          </button>
                          <button onClick={() => deleteProduct(id)} className="text-red-600 text-[10px] font-bold">حذف</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'chats' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 h-[50vh]">
                <div className="border rounded-2xl p-3 overflow-y-auto bg-slate-50">
                  <h4 className="font-bold text-xs mb-3">العملاء</h4>
                  {Object.keys(allChats).map(uid => (
                    <button key={uid} onClick={() => setSelectedChatUser(uid)} className={`w-full text-start p-2 rounded-xl mb-1 text-xs ${selectedChatUser === uid ? 'bg-[#2d3a2e] text-white' : 'bg-white border'}`}>
                      عميل: {uid.slice(0, 6)}...
                    </button>
                  ))}
                </div>
                <div className="md:col-span-2 border rounded-2xl flex flex-col bg-slate-50">
                  {selectedChatUser ? (
                    <>
                      <div className="p-3 bg-white border-b text-xs font-bold">محادثة العميل</div>
                      <div className="flex-1 p-3 overflow-y-auto space-y-2">
                        {Object.values(allChats[selectedChatUser] || {}).map((m, i) => (
                          <div key={i} className={`flex flex-col ${m.sender === 'admin' ? 'items-end' : 'items-start'}`}>
                            <div className={`p-2 rounded-xl text-xs max-w-[80%] ${m.sender === 'admin' ? 'bg-[#2d3a2e] text-white' : 'bg-white border'}`}>{m.text}</div>
                          </div>
                        ))}
                      </div>
                      <form onSubmit={sendAdminMessage} className="p-2 bg-white border-t flex gap-2">
                        <input type="text" value={adminReply} onChange={e=>setAdminReply(e.target.value)} placeholder="رد الأدمن..." className="flex-1 p-2 border rounded-xl text-xs" />
                        <button type="submit" className="bg-[#2d3a2e] text-white px-4 py-2 rounded-xl text-xs font-bold">إرسال</button>
                      </form>
                    </>
                  ) : <div className="flex items-center justify-center h-full text-xs text-slate-400">اختر عميلاً</div>}
                </div>
              </div>
            )}

            {activeTab === 'settings' && (
              <form onSubmit={saveSettings} className="max-w-md space-y-3">
                <div>
                  <label className="block text-xs font-bold mb-1">سعر التوصيل (ج.م)</label>
                  <input type="number" value={deliveryFeeInput} onChange={e=>setDeliveryFeeInput(e.target.value)} className="w-full p-2 border rounded-xl text-xs" />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">رابط واتساب</label>
                  <input type="text" value={whatsappInput} onChange={e=>setWhatsappInput(e.target.value)} className="w-full p-2 border rounded-xl text-xs" />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">رابط فيسبوك</label>
                  <input type="text" value={facebookInput} onChange={e=>setFacebookInput(e.target.value)} className="w-full p-2 border rounded-xl text-xs" />
                </div>
                <button type="submit" className="bg-[#2d3a2e] text-white px-5 py-2 rounded-xl text-xs font-bold">حفظ الإعدادات</button>
              </form>
            )}
          </div>
        );
      }

      window.addEventListener('firebase-ready', () => {
        ReactDOM.render(<App />, document.getElementById('root'));
      });
    </script>
  </body>
</html>
