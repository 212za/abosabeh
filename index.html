<!doctype html>
<html lang="ar" dir="rtl" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أبو صبيح - ABOSABEH</title>
    
    <!-- خطوط جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#1e293b',
                green: '#0f766e',
                cream: '#f8fafc',
                accent: '#0d9488'
              }
            },
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

      window.firebaseConfig = {
        apiKey: "AIzaSyBMpZ7CXOJbgKpMqOjzsbbCcpHBlslU3mw",
        authDomain: "salah-52496.firebaseapp.com",
        databaseURL: "https://salah-52496-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "salah-52496",
        storageBucket: "salah-52496.firebasestorage.app",
        messagingSenderId: "235427387836",
        appId: "1:235427387836:web:5ad91f888f013bb603f3b9",
        measurementId: "G-MK9QC8X5QQ"
      };

      window.app = initializeApp(window.firebaseConfig);
      window.auth = getAuth(window.app);
      window.db = getDatabase(window.app);
      window.GoogleAuthProvider = GoogleAuthProvider;
      window.signInWithPopup = signInWithPopup;
      window.signOut = signOut;
      window.onAuthStateChanged = onAuthStateChanged;
      window.dbRef = ref;
      window.dbSet = set;
      window.dbPush = push;
      window.dbOnValue = onValue;
      window.dbUpdate = update;
      window.dbRemove = remove;
      
      // إطلاق حدث أن فايربيس جاهز
      window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
      body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #1e293b; }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // ترجمة بسيطة للواجهة
      const translations = {
        ar: {
          brand: "أبو صبيح",
          subtitle: "متجر المعدات والأجهزة المتكامل",
          login: "تسجيل الدخول بـ Google",
          logout: "خروج",
          adminPanel: "لوحة الأدمن",
          storePickup: "استلام من المتجر",
          delivery: "توصيل للمنزل",
          price: "السعر",
          deliveryFee: "رسوم التوصيل",
          buyNow: "شراء / طلب المنتج",
          chatWithAdmin: "محادثة الأدمن",
          statusAvailable: "متوفر",
          statusSold: "تم البيع",
          send: "إرسال",
          typeMessage: "اكتب رسلتك أو ارفق رابط السكرين شوت هنا...",
          settings: "الإعدادات وروابط التواصل",
          products: "المنتجات والمعدات",
          sales: "المبيعات والطلبات",
          save: "حفظ",
          cancel: "إلغاء",
          addProduct: "إضافة معدة/منتج جديد",
          productName: "اسم المنتج",
          productDesc: "الوصف (اختياري)",
          productPrice: "السعر الأساسي",
          images: "روابط الصور (من 1 إلى 4 صور)",
        },
        en: {
          brand: "ABOSABEH",
          subtitle: "Unified Equipment & Machinery Store",
          login: "Sign in with Google",
          logout: "Logout",
          adminPanel: "Admin Panel",
          storePickup: "Store Pickup",
          delivery: "Home Delivery",
          price: "Price",
          deliveryFee: "Delivery Fee",
          buyNow: "Buy / Order Product",
          chatWithAdmin: "Chat with Admin",
          statusAvailable: "Available",
          statusSold: "Sold Out",
          send: "Send",
          typeMessage: "Type your message or paste screenshot link...",
          settings: "Settings & Social Links",
          products: "Products & Equipment",
          sales: "Sales & Orders",
          save: "Save",
          cancel: "Cancel",
          addProduct: "Add New Product",
          productName: "Product Name",
          productDesc: "Description (Optional)",
          productPrice: "Base Price",
          images: "Image URLs (1 to 4 images)",
        }
      };

      function App() {
        const [lang, setLang] = useState('ar');
        const [user, setUser] = useState(null);
        const [isAdmin, setIsAdmin] = useState(false);
        const [currentView, setCurrentView] = useState('shop'); // shop, admin, chat
        
        // البيانات القادمة من Firebase
        const [products, setProducts] = useState({});
        const [settings, setSettings] = useState({ deliveryFee: 50, whatsapp: '', facebook: '' });
        const [chats, setChats] = useState({});
        const [orders, setOrders] = useState({});
        
        // تفاصيل المنتج المحدد للشراء أو العرض
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [activeImageIndex, setActiveImageIndex] = useState(0);
        const [orderType, setOrderType] = useState('pickup'); // pickup or delivery
        const [chatMessages, setChatMessages] = useState([]);
        const [newMessage, setNewMessage] = useState('');

        // حسابات الأدمن المسموحة (يمكنك تعديل إيميلك هنا ليصبح أدمن تلقائياً)
        const adminEmails = ["salah@gmail.com", "abosabeh@gmail.com"];

        useEffect(() => {
          const checkFirebase = setInterval(() => {
            if (window.auth) {
              clearInterval(checkFirebase);
              window.onAuthStateChanged(window.auth, (u) => {
                if (u) {
                  setUser(u);
                  if (adminEmails.includes(u.email) || u.email.includes("admin")) {
                    setIsAdmin(true);
                  }
                } else {
                  setUser(null);
                  setIsAdmin(false);
                }
              });

              // جلب المنتجات
              window.dbOnValue(window.dbRef(window.db, 'products'), (snapshot) => {
                setProducts(snapshot.val() || {});
              });

              // جلب الإعدادات (سعر التوصيل وروابط التواصل)
              window.dbOnValue(window.dbRef(window.db, 'settings'), (snapshot) => {
                setSettings(snapshot.val() || { deliveryFee: 50, whatsapp: '', facebook: '' });
              });

              // جلب الطلبات
              window.dbOnValue(window.dbRef(window.db, 'orders'), (snapshot) => {
                setOrders(snapshot.val() || {});
              });
            }
          }, 500);
        }, []);

        const loginWithGoogle = async () => {
          try {
            const provider = new window.GoogleAuthProvider();
            await window.signInWithPopup(window.auth, provider);
          } catch (error) {
            console.error(error);
            alert("خطأ في تسجيل الدخول: " + error.message);
          }
        };

        const logout = async () => {
          await window.signOut(window.auth);
          setCurrentView('shop');
        };

        const t = translations[lang];

        return (
          <div className="min-h-screen bg-slate-50" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
            {/* شريط التنقل العلوي */}
            <header className="bg-white shadow-sm sticky top-0 z-50">
              <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('shop')}>
                  <div className="bg-teal-700 text-white p-2 rounded-xl font-bold text-xl">أ.ص</div>
                  <div>
                    <h1 className="text-xl font-bold text-slate-800">{t.brand}</h1>
                    <p className="text-xs text-slate-500">{t.subtitle}</p>
                  </div>
                </div>

                <div className="flex items-center gap-4">
                  {/* تغيير اللغة */}
                  <button 
                    onClick={() => {
                      const newLang = lang === 'ar' ? 'en' : 'ar';
                      setLang(newLang);
                      document.getElementById('html-root').setAttribute('dir', newLang === 'ar' ? 'rtl' : 'ltr');
                    }}
                    className="px-3 py-1.5 text-sm bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold"
                  >
                    {lang === 'ar' ? 'English' : 'العربية'}
                  </button>

                  {/* روابط السوشيال المتاحة من الأدمن */}
                  {settings.whatsapp && (
                    <a href={settings.whatsapp} target="_blank" className="text-green-600 font-bold hover:underline text-sm hidden sm:inline">WhatsApp</a>
                  )}
                  {settings.facebook && (
                    <a href={settings.facebook} target="_blank" className="text-blue-600 font-bold hover:underline text-sm hidden sm:inline">Facebook</a>
                  )}

                  {user ? (
                    <div className="flex items-center gap-3">
                      <span className="text-sm font-medium hidden md:inline">{user.displayName}</span>
                      {isAdmin && (
                        <button 
                          onClick={() => setCurrentView(currentView === 'admin' ? 'shop' : 'admin')}
                          className="bg-teal-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-teal-800"
                        >
                          {currentView === 'admin' ? t.products : t.adminPanel}
                        </button>
                      )}
                      <button 
                        onClick={() => setCurrentView('chat')}
                        className="bg-amber-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-amber-700"
                      >
                        {t.chatWithAdmin}
                      </button>
                      <button onClick={logout} className="text-red-500 hover:text-red-700 text-sm font-medium">
                        {t.logout}
                      </button>
                    </div>
                  ) : (
                    <button 
                      onClick={loginWithGoogle}
                      className="bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-800 flex items-center gap-2"
                    >
                      {t.login}
                    </button>
                  )}
                </div>
              </div>
            </header>

            {/* المحتوى الرئيسي */}
            <main className="max-w-7xl mx-auto px-4 py-8">
              {currentView === 'shop' && (
                <ShopView 
                  products={products} 
                  settings={settings} 
                  lang={lang} 
                  onSelectProduct={(p) => { setSelectedProduct(p); setActiveImageIndex(0); }} 
                />
              )}

              {currentView === 'admin' && isAdmin && (
                <AdminPanel lang={lang} settings={settings} products={products} orders={orders} />
              )}

              {currentView === 'chat' && user && (
                <ChatView user={user} lang={lang} />
              )}
            </main>

            {/* نافذة تفاصيل المنتج والشراء */}
            {selectedProduct && (
              <ProductModal 
                product={selectedProduct} 
                settings={settings}
                lang={lang}
                activeImageIndex={activeImageIndex}
                setActiveImageIndex={setActiveImageIndex}
                orderType={orderType}
                setOrderType={setOrderType}
                onClose={() => setSelectedProduct(null)}
                user={user}
                onOpenChat={() => {
                  setSelectedProduct(null);
                  setCurrentView('chat');
                }}
              />
            )}
          </div>
        );
      }

      // واجهة المتجر الرئيسية للعملاء
      function ShopView({ products, settings, lang, onSelectProduct }) {
        const productList = Object.keys(products).map(key => ({ id: key, ...products[key] }));

        return (
          <div>
            <div className="mb-8 text-center md:text-start">
              <h2 className="text-3xl font-bold text-slate-800 mb-2">
                {lang === 'ar' ? 'المعدات والأجهزة المتاحة' : 'Available Equipment'}
              </h2>
              <p className="text-slate-500">
                {lang === 'ar' ? 'اختر معدتك واطلبها بسهولة مع خدمة التوصيل أو الاستلام من المتجر' : 'Browse our equipment and order easily with pickup or delivery'}
              </p>
            </div>

            {productList.length === 0 ? (
              <div className="text-center py-16 bg-white rounded-2xl shadow-sm border border-slate-100">
                <p className="text-slate-400 text-lg">
                  {lang === 'ar' ? 'لا توجد معدات معروضة حالياً. تابعنا قريباً!' : 'No equipment available right now.'}
                </p>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {productList.map(item => {
                  const images = item.images || [item.image || 'https://via.placeholder.com/400'];
                  const isSold = item.status === 'sold';
                  
                  return (
                    <div key={item.id} className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition-shadow">
                      <div>
                        <div className="relative h-56 bg-slate-100 overflow-hidden">
                          <img src={images[0]} alt={item.name} className="w-full h-full object-cover" />
                          {isSold ? (
                            <span className="absolute top-3 right-3 bg-red-500 text-white text-xs px-3 py-1 rounded-full font-bold">
                              {lang === 'ar' ? 'تم البيع' : 'Sold Out'}
                            </span>
                          ) : (
                            <span className="absolute top-3 right-3 bg-teal-600 text-white text-xs px-3 py-1 rounded-full font-bold">
                              {lang === 'ar' ? 'متوفر' : 'Available'}
                            </span>
                          )}
                        </div>
                        <div className="p-5">
                          <h3 className="text-lg font-bold text-slate-800 mb-1">{item.name}</h3>
                          {item.description && (
                            <p className="text-slate-500 text-sm line-clamp-2 mb-3">{item.description}</p>
                          )}
                          <div className="text-xl font-bold text-teal-700">
                            {item.price} ج.م
                          </div>
                        </div>
                      </div>

                      <div className="p-5 pt-0">
                        <button
                          onClick={() => onSelectProduct(item)}
                          className="w-full bg-slate-900 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-slate-800 transition-colors"
                        >
                          {lang === 'ar' ? 'عرض التفاصيل والطلب' : 'View Details & Order'}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      }

      // نافذة تفاصيل المنتج
      function ProductModal({ product, settings, lang, activeImageIndex, setActiveImageIndex, orderType, setOrderType, onClose, user, onOpenChat }) {
        const images = product.images || [product.image || 'https://via.placeholder.com/400'];
        const deliveryFee = Number(settings.deliveryFee || 50);
        const totalPrice = orderType === 'delivery' ? Number(product.price) + deliveryFee : Number(product.price);

        return (
          <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative">
              <button 
                onClick={onClose}
                className="absolute top-4 left-4 bg-slate-100 hover:bg-slate-200 w-9 h-9 rounded-full flex items-center justify-center font-bold text-slate-600"
              >
                ✕
              </button>

              <div className="mb-4">
                <div className="h-72 bg-slate-100 rounded-2xl overflow-hidden mb-3">
                  <img src={images[activeImageIndex]} alt={product.name} className="w-full h-full object-cover" />
                </div>
                {images.length > 1 && (
                  <div className="flex gap-2 overflow-x-auto pb-2">
                    {images.map((img, idx) => (
                      <button 
                        key={idx}
                        onClick={() => setActiveImageIndex(idx)}
                        className={`w-16 h-16 rounded-xl overflow-hidden border-2 flex-shrink-0 ${activeImageIndex === idx ? 'border-teal-600' : 'border-transparent'}`}
                      >
                        <img src={img} alt="" className="w-full h-full object-cover" />
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <h2 className="text-2xl font-bold text-slate-800 mb-2">{product.name}</h2>
              {product.description && (
                <p className="text-slate-600 text-sm mb-4 leading-relaxed">{product.description}</p>
              )}

              <div className="bg-slate-50 p-4 rounded-2xl mb-6">
                <label className="block text-sm font-bold text-slate-700 mb-2">
                  {lang === 'ar' ? 'طريقة الاستلام والتوصيل:' : 'Fulfillment Method:'}
                </label>
                <div className="grid grid-cols-2 gap-3">
                  <button
                    type="button"
                    onClick={() => setOrderType('pickup')}
                    className={`p-3 rounded-xl border text-sm font-semibold transition-all ${orderType === 'pickup' ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600'}`}
                  >
                    <div>{lang === 'ar' ? 'استلام من المتجر' : 'Store Pickup'}</div>
                    <div className="text-xs opacity-75 mt-1">{product.price} ج.م</div>
                  </button>
                  <button
                    type="button"
                    onClick={() => setOrderType('delivery')}
                    className={`p-3 rounded-xl border text-sm font-semibold transition-all ${orderType === 'delivery' ? 'border-teal-600 bg-teal-50 text-teal-800' : 'border-slate-200 bg-white text-slate-600'}`}
                  >
                    <div>{lang === 'ar' ? 'توصيل للمنزل' : 'Home Delivery'}</div>
                    <div className="text-xs opacity-75 mt-1">{product.price} + {deliveryFee} توصيل</div>
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-between mb-6 pt-4 border-t border-slate-100">
                <div>
                  <span className="text-xs text-slate-400 block">{lang === 'ar' ? 'الإجمالي المطلوب' : 'Total Amount'}</span>
                  <span className="text-2xl font-bold text-teal-700">{totalPrice} ج.م</span>
                </div>
                <div className="text-xs text-slate-500 max-w-[220px] text-end">
                  {lang === 'ar' ? 'يرجى تحويل المبلغ ثم إرسال سكرين شوت التحويل في الشات لتأكيد الطلب.' : 'Please transfer funds and send screenshot in chat.'}
                </div>
              </div>

              {user ? (
                <button
                  onClick={onOpenChat}
                  className="w-full bg-teal-700 text-white py-3 rounded-xl font-bold hover:bg-teal-800 transition-colors shadow-sm"
                >
                  {lang === 'ar' ? 'انتقل للشات لإرسال إثبات الدفع وتأكيد الطلب' : 'Go to Chat to Send Payment Proof & Confirm'}
                </button>
              ) : (
                <div className="text-center text-sm text-red-500 font-semibold bg-red-50 p-3 rounded-xl">
                  {lang === 'ar' ? 'يرجى تسجيل الدخول أولاً لتتمكن من إتمام الطلب ومراسلة الأدمن.' : 'Please sign in first to complete your order and chat with admin.'}
                </div>
              )}
            </div>
          </div>
        );
      }

      // محادثة الشات المنفصل لكل مستخدم
      function ChatView({ user, lang }) {
        const [messages, setMessages] = useState([]);
        const [text, setText] = useState('');

        useEffect(() => {
          const chatRef = window.dbRef(window.db, `chats/${user.uid}`);
          window.dbOnValue(chatRef, (snapshot) => {
            const data = snapshot.val() || {};
            const list = Object.keys(data).map(k => ({ id: k, ...data[k] }));
            setMessages(list);
          });
        }, [user.uid]);

        const sendMessage = (e) => {
          e.preventDefault();
          if (!text.trim()) return;

          const chatRef = window.dbRef(window.db, `chats/${user.uid}`);
          window.dbPush(chatRef, {
            sender: user.uid,
            senderName: user.displayName || 'عميل',
            text: text,
            timestamp: Date.now()
          });
          setText('');
        };

        return (
          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 max-w-4xl mx-auto flex flex-col h-[75vh]">
            <div className="p-4 border-b border-slate-100 bg-slate-50 rounded-t-3xl flex items-center justify-between">
              <h3 className="font-bold text-slate-800">
                {lang === 'ar' ? 'محادثتك الخاصة مع إدارة أبو صبيح' : 'Your Private Chat with Abosabeh Admin'}
              </h3>
              <span className="text-xs text-teal-700 bg-teal-50 px-3 py-1 rounded-full font-semibold">
                {lang === 'ar' ? 'محادثة آمنة وخاصة' : 'Secure Private Chat'}
              </span>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {messages.length === 0 ? (
                <div className="text-center text-slate-400 py-12">
                  {lang === 'ar' ? 'لا توجد رسائل بعد. أرسل استفسارك أو سكرين شوت الدفع هنا.' : 'No messages yet. Send your query or payment screenshot here.'}
                </div>
              ) : (
                messages.map(msg => {
                  const isMe = msg.sender === user.uid;
                  return (
                    <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                      <div className={`max-w-[80%] p-3.5 rounded-2xl text-sm ${isMe ? 'bg-teal-700 text-white rounded-br-none' : 'bg-slate-100 text-slate-800 rounded-bl-none'}`}>
                        {msg.text}
                      </div>
                      <span className="text-[10px] text-slate-400 mt-1 px-1">
                        {new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                      </span>
                    </div>
                  );
                })
              )}
            </div>

            <form onSubmit={sendMessage} className="p-4 border-t border-slate-100 flex gap-2">
              <input
                type="text"
                value={text}
                onChange={(e) => setText(e.target.value)}
                placeholder={lang === 'ar' ? 'اكتب رسلتك أو ارفق رابط السكرين شوت هنا...' : 'Type message or screenshot link...'}
                className="flex-1 px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-teal-600"
              />
              <button type="submit" className="bg-teal-700 text-white px-6 py-3 rounded-xl font-bold text-sm hover:bg-teal-800 transition-colors">
                {lang === 'ar' ? 'إرسال' : 'Send'}
              </button>
            </form>
          </div>
        );
      }

      // لوحة تحكم الأدمن الكاملة
      function AdminPanel({ lang, settings, products, orders }) {
        const [activeTab, setActiveTab] = useState('products'); // products, chats, settings
        const [name, setName] = useState('');
        const [desc, setDesc] = useState('');
        const [price, setPrice] = useState('');
        const [img1, setImg1] = useState('');
        const [img2, setImg2] = useState('');
        const [img3, setImg3] = useState('');
        const [img4, setImg4] = useState('');
        
        const [deliveryFeeInput, setDeliveryFeeInput] = useState(settings.deliveryFee || 50);
        const [whatsappInput, setWhatsappInput] = useState(settings.whatsapp || '');
        const [facebookInput, setFacebookInput] = useState(settings.facebook || '');
        
        const [allChats, setAllChats] = useState({});
        const [selectedChatUser, setSelectedChatUser] = useState(null);
        const [adminReply, setAdminReply] = useState('');

        useEffect(() => {
          window.dbOnValue(window.dbRef(window.db, 'chats'), (snapshot) => {
            setAllChats(snapshot.val() || {});
          });
        }, []);

        const addProduct = (e) => {
          e.preventDefault();
          if (!name || !price || !img1) {
            alert("يرجى إدخال اسم المنتج، السعر، والصورة الرئيسية على الأقل.");
            return;
          }

          const images = [img1, img2, img3, img4].filter(Boolean);
          const productsRef = window.dbRef(window.db, 'products');
          window.dbPush(productsRef, {
            name,
            description: desc,
            price: Number(price),
            images,
            status: 'available',
            createdAt: Date.now()
          });

          setName(''); setDesc(''); setPrice(''); setImg1(''); setImg2(''); setImg3(''); setImg4('');
          alert("تم إضافة المنتج بنجاح!");
        };

        const toggleStatus = (id, currentStatus) => {
          const newStatus = currentStatus === 'sold' ? 'available' : 'sold';
          window.dbUpdate(window.dbRef(window.db, `products/${id}`), { status: newStatus });
        };

        const deleteProduct = (id) => {
          if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
            window.dbRemove(window.dbRef(window.db, `products/${id}`));
          }
        };

        const saveSettings = (e) => {
          e.preventDefault();
          window.dbSet(window.dbRef(window.db, 'settings'), {
            deliveryFee: Number(deliveryFeeInput),
            whatsapp: whatsappInput,
            facebook: facebookInput
          });
          alert("تم حفظ الإعدادات بنجاح!");
        };

        const sendAdminMessage = (e) => {
          e.preventDefault();
          if (!adminReply.trim() || !selectedChatUser) return;

          const chatRef = window.dbRef(window.db, `chats/${selectedChatUser}`);
          window.dbPush(chatRef, {
            sender: 'admin',
            senderName: 'الأدمن (أبو صبيح)',
            text: adminReply,
            timestamp: Date.now()
          });
          setAdminReply('');
        };

        return (
          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6">
            <div className="flex gap-4 mb-6 border-b border-slate-100 pb-4">
              <button 
                onClick={() => setActiveTab('products')}
                className={`px-4 py-2 rounded-xl text-sm font-bold ${activeTab === 'products' ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-700'}`}
              >
                إدارة المنتجات والمبيعات
              </button>
              <button 
                onClick={() => setActiveTab('chats')}
                className={`px-4 py-2 rounded-xl text-sm font-bold ${activeTab === 'chats' ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-700'}`}
              >
                محادثات العملاء (الشات)
              </button>
              <button 
                onClick={() => setActiveTab('settings')}
                className={`px-4 py-2 rounded-xl text-sm font-bold ${activeTab === 'settings' ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-700'}`}
              >
                إعدادات المتجر والتوصيل
              </button>
            </div>

            {activeTab === 'products' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                {/* نموذج إضافة منتج */}
                <div className="bg-slate-50 p-5 rounded-2xl">
                  <h3 className="font-bold text-slate-800 mb-4">إضافة معدة/منتج جديد</h3>
                  <form onSubmit={addProduct} className="space-y-3">
                    <input type="text" placeholder="اسم المنتج" value={name} onChange={e=>setName(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    <textarea placeholder="الوصف (اختياري)" value={desc} onChange={e=>setDesc(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" rows="2" />
                    <input type="number" placeholder="السعر الأساسي" value={price} onChange={e=>setPrice(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    
                    <input type="text" placeholder="رابط الصورة الرئيسية (إجباري)" value={img1} onChange={e=>setImg1(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    <input type="text" placeholder="رابط الصورة 2 (اختياري)" value={img2} onChange={e=>setImg2(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    <input type="text" placeholder="رابط الصورة 3 (اختياري)" value={img3} onChange={e=>setImg3(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    <input type="text" placeholder="رابط الصورة 4 (اختياري)" value={img4} onChange={e=>setImg4(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />

                    <button type="submit" className="w-full bg-teal-700 text-white py-2.5 rounded-xl text-sm font-bold hover:bg-teal-800">
                      إضافة المنتج للمتجر
                    </button>
                  </form>
                </div>

                {/* قائمة المنتجات الحالية وتغيير حالتها */}
                <div className="lg:col-span-2">
                  <h3 className="font-bold text-slate-800 mb-4">المنتجات المعروضة ومتابعة حالتها</h3>
                  <div className="space-y-3">
                    {Object.keys(products).length === 0 ? (
                      <p className="text-slate-400 text-sm">لا توجد منتجات مضافة.</p>
                    ) : (
                      Object.keys(products).map(id => {
                        const p = products[id];
                        const isSold = p.status === 'sold';
                        return (
                          <div key={id} className="flex items-center justify-between p-3 border rounded-xl bg-white shadow-sm">
                            <div className="flex items-center gap-3">
                              <img src={p.images?.[0] || p.image} alt="" className="w-12 h-12 rounded-lg object-cover" />
                              <div>
                                <h4 className="font-bold text-slate-800 text-sm">{p.name}</h4>
                                <span className="text-xs text-teal-700 font-bold">{p.price} ج.م</span>
                              </div>
                            </div>
                            <div className="flex items-center gap-2">
                              <button 
                                onClick={() => toggleStatus(id, p.status)}
                                className={`px-3 py-1.5 rounded-lg text-xs font-bold ${isSold ? 'bg-red-100 text-red-700' : 'bg-teal-100 text-teal-700'}`}
                              >
                                {isSold ? 'تم البيع (تغيير لمتوفر)' : 'متوفر (تغيير لمباع)'}
                              </button>
                              <button onClick={() => deleteProduct(id)} className="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1">
                                حذف
                              </button>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'chats' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 h-[60vh]">
                <div className="border rounded-2xl p-3 overflow-y-auto bg-slate-50">
                  <h4 className="font-bold text-slate-700 mb-3 text-sm">قائمة العملاء (المحادثات المنفصلة)</h4>
                  {Object.keys(allChats).length === 0 ? (
                    <p className="text-slate-400 text-xs">لا توجد محادثات حتى الآن.</p>
                  ) : (
                    Object.keys(allChats).map(uid => (
                      <button
                        key={uid}
                        onClick={() => setSelectedChatUser(uid)}
                        className={`w-full text-start p-3 rounded-xl mb-2 text-xs font-semibold ${selectedChatUser === uid ? 'bg-teal-700 text-white' : 'bg-white text-slate-700 border'}`}
                      >
                        عميل معرف: {uid.slice(0, 8)}...
                      </button>
                    ))
                  )}
                </div>

                <div className="md:col-span-2 border rounded-2xl flex flex-col bg-slate-50">
                  {selectedChatUser ? (
                    <>
                      <div className="p-3 bg-white border-b rounded-t-2xl font-bold text-xs text-slate-700">
                        محادثة مع العميل: {selectedChatUser}
                      </div>
                      <div className="flex-1 p-3 overflow-y-auto space-y-3">
                        {Object.values(allChats[selectedChatUser] || {}).map((m, i) => (
                          <div key={i} className={`flex flex-col ${m.sender === 'admin' ? 'items-end' : 'items-start'}`}>
                            <div className={`p-2.5 rounded-xl text-xs max-w-[80%] ${m.sender === 'admin' ? 'bg-teal-700 text-white' : 'bg-white border text-slate-800'}`}>
                              <span className="block font-bold text-[10px] opacity-75 mb-0.5">{m.senderName}</span>
                              {m.text}
                            </div>
                          </div>
                        ))}
                      </div>
                      <form onSubmit={sendAdminMessage} className="p-3 bg-white border-t rounded-b-2xl flex gap-2">
                        <input
                          type="text"
                          value={adminReply}
                          onChange={e=>setAdminReply(e.target.value)}
                          placeholder="رد الأدمن على العميل..."
                          className="flex-1 px-3 py-2 border rounded-xl text-xs"
                        />
                        <button type="submit" className="bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-bold">إرسال الرد</button>
                      </form>
                    </>
                  ) : (
                    <div className="flex items-center justify-center h-full text-slate-400 text-sm">
                      اختر عميلاً من القائمة لعرض المحادثة والرد عليه
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'settings' && (
              <form onSubmit={saveSettings} className="max-w-md space-y-4">
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">سعر خدمة التوصيل (ج.م)</label>
                  <input type="number" value={deliveryFeeInput} onChange={e=>setDeliveryFeeInput(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                </div>
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">رابط واتساب (تواصل الأيقونة)</label>
                  <input type="text" value={whatsappInput} onChange={e=>setWhatsappInput(e.target.value)} placeholder="https://wa.me/..." className="w-full px-3 py-2 border rounded-xl text-sm" />
                </div>
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">رابط فيسبوك (تواصل الأيقونة)</label>
                  <input type="text" value={facebookInput} onChange={e=>setFacebookInput(e.target.value)} placeholder="https://facebook.com/..." className="w-full px-3 py-2 border rounded-xl text-sm" />
                </div>
                <button type="submit" className="bg-teal-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold hover:bg-teal-800">
                  حفظ الإعدادات
                </button>
              </form>
            )}
          </div>
        );
      }

      window.addEventListener('firebase-ready', () => {
        ReactDOM.render(<App />, document.getElementById('root'));
      });
    </script>
  </body>
</html>
