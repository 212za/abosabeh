<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palomar - One Unified System for LLMs</title>
    <meta name="description" content="One unified system to build, test, ship, and observe LLMs." />
    
    <!-- خطوط جوجل والخطوط المستخدمة -->
    <link href="https://db.onlinewebfonts.com/c/0e6de1ec911a2e267ff136bbdd384a44?family=Helvetica+Neue+Light" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Oswald:wght@500&family=Montserrat:wght@700&family=Roboto+Slab:wght@600&family=Raleway:wght@700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (عبر CDN لتشغيل التصميم مباشرة) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-dark': '#2d3a2e',
              'brand-green': '#3d5a3e',
              'brand-light': '#f5f3ef',
              'brand-cream': '#faf8f5',
            },
            fontFamily: {
              'helvetica-neue': ['"Helvetica Neue Light"', 'Helvetica', 'Arial', 'sans-serif'],
              'playfair': ['"Playfair Display"', 'serif'],
              'oswald': ['"Oswald"', 'sans-serif'],
              'montserrat': ['"Montserrat"', 'sans-serif'],
              'roboto-slab': ['"Roboto Slab"', 'serif'],
              'raleway': ['"Raleway"', 'serif'],
            }
          }
        }
      }
    </script>

    <!-- أكواد الـ CSS والتصميم المتكاملة -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Helvetica Neue Light', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #faf8f5;
        color: #2d3a2e;
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes fade-down {
        from { opacity: 0; transform: translateY(-12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-up {
        animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .animate-fade-down {
        animation: fade-down 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .stagger-1 { animation-delay: 0ms; }
      .stagger-2 { animation-delay: 120ms; }
      .stagger-3 { animation-delay: 240ms; }
      .stagger-4 { animation-delay: 360ms; }
      .stagger-5 { animation-delay: 480ms; }
      .stagger-6 { animation-delay: 600ms; }
    </style>

    <!-- استدعاء React و Babel لتشغيل الـ JSX في المتصفح مباشرة -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- مكتبة الأيقونات Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="w-full min-h-screen bg-[#faf8f5] font-['Helvetica_Neue_Light',Helvetica,Arial,sans-serif]">
    
    <!-- مكان عرض تطبيق React -->
    <div id="root"></div>

    <!-- كود تطبيق React المجمع بالكامل -->
    <script type="text/babel">
      const { useState, useEffect } = React;
      // محاكاة أيقونات Lucide داخل React
      const ChevronDown = () => <span className="inline-block w-3.5 h-3.5">&#9662;</span>;
      const ArrowRight = () => <span className="inline-block ml-1">&rarr;</span>;
      const Triangle = () => <span className="inline-block font-bold">&#9650;</span>;

      function Navbar({ isScrolled, mobileMenuOpen, setMobileMenuOpen }) {
        return (
          <div>
            <header
              className={`fixed top-0 left-0 right-0 z-50 transition-colors duration-300 ${
                isScrolled
                  ? 'bg-[#faf8f5]/90 backdrop-blur-md shadow-sm'
                  : 'bg-transparent'
              }`}
            >
              <div className="max-w-7xl mx-auto px-6 lg:px-8">
                <div className="relative flex items-center h-16 md:h-20">
                  {/* Desktop left links */}
                  <nav className="hidden md:flex items-center gap-8 animate-fade-down stagger-1">
                    <button
                      type="button"
                      className="flex items-center gap-1 text-sm text-[#2d3a2e] tracking-wide uppercase hover:opacity-70 transition-opacity cursor-pointer"
                    >
                      <span>Solutions</span>
                      <ChevronDown />
                    </button>
                    <a
                      href="#plans"
                      className="text-sm text-[#2d3a2e] tracking-wide uppercase hover:opacity-70 transition-opacity"
                    >
                      Plans
                    </a>
                    <a
                      href="#news"
                      className="text-sm text-[#2d3a2e] tracking-wide uppercase hover:opacity-70 transition-opacity"
                    >
                      News
                    </a>
                  </nav>

                  {/* Center logo */}
                  <a
                    href="#"
                    className="absolute left-1/2 -translate-x-1/2 flex items-center gap-2 animate-fade-down stagger-2 select-none"
                  >
                    <span className="text-xl text-[#2d3a2e]">&#9650;</span>
                    <span className="text-xl text-[#2d3a2e] tracking-tight font-medium">
                      Palomar
                    </span>
                  </a>

                  {/* Desktop CTA */}
                  <a
                    href="#try"
                    className="hidden md:inline-flex items-center ml-auto px-5 py-2.5 bg-[#2d3a2e] text-white text-sm tracking-wide uppercase rounded-full hover:bg-[#3d5a3e] transition-colors animate-fade-down stagger-3"
                  >
                    Try It Free
                  </a>

                  {/* Mobile hamburger */}
                  <button
                    type="button"
                    className="md:hidden ml-auto z-50 w-10 h-10 relative flex items-center justify-center focus:outline-none cursor-pointer"
                    aria-label="Toggle menu"
                    onClick={() => setMobileMenuOpen((prev) => !prev)}
                  >
                    <div className="relative w-6 h-5">
                      <span
                        className={`absolute left-0 top-[6px] w-6 h-[2px] bg-[#2d3a2e] rounded transition-all duration-300 ${
                          mobileMenuOpen ? 'rotate-45 translate-y-[5px]' : ''
                        }`}
                      />
                      <span
                        className={`absolute left-0 top-[13px] w-6 h-[2px] bg-[#2d3a2e] rounded transition-all duration-300 ${
                          mobileMenuOpen ? '-rotate-45' : ''
                        }`}
                      />
                    </div>
                  </button>
                </div>
              </div>
            </header>

            {/* Mobile overlay */}
            <div
              className={`fixed inset-0 bg-[#faf8f5] z-40 transition-opacity duration-500 md:hidden ${
                mobileMenuOpen
                  ? 'opacity-100 pointer-events-auto'
                  : 'opacity-0 pointer-events-none'
              }`}
            >
              <div
                className={`flex flex-col items-center justify-center h-full gap-8 transition-all duration-500 delay-100 ${
                  mobileMenuOpen
                    ? 'translate-y-0 opacity-100'
                    : '-translate-y-8 opacity-0'
                }`}
              >
                <a
                  href="#solutions"
                  onClick={() => setMobileMenuOpen(false)}
                  className="text-3xl text-[#2d3a2e] tracking-tight hover:opacity-70 transition-opacity"
                >
                  Solutions
                </a>
                <a
                  href="#plans"
                  onClick={() => setMobileMenuOpen(false)}
                  className="text-3xl text-[#2d3a2e] tracking-tight hover:opacity-70 transition-opacity"
                >
                  Plans
                </a>
                <a
                  href="#news"
                  onClick={() => setMobileMenuOpen(false)}
                  className="text-3xl text-[#2d3a2e] tracking-tight hover:opacity-70 transition-opacity"
                >
                  News
                </a>
                <a
                  href="#try"
                  onClick={() => setMobileMenuOpen(false)}
                  className="mt-4 inline-flex items-center px-8 py-3.5 bg-[#2d3a2e] text-white text-lg tracking-wide rounded-full hover:bg-[#3d5a3e] transition-colors"
                >
                  Try It Free
                </a>
              </div>
            </div>
          </div>
        );
      }

      function TrustedBy() {
        return (
          <div className="w-full mt-8 md:mt-10 animate-fade-up stagger-5">
            <div className="text-left text-xs tracking-[0.25em] uppercase text-[#2d3a2e]/50 mb-6 md:mb-8">
              Backed by
            </div>
            <div className="flex flex-wrap items-center justify-start gap-6 md:gap-12 lg:gap-16 animate-fade-up stagger-6">
              <span className="font-['Playfair_Display'] font-bold text-lg md:text-xl lg:text-2xl text-[#2d3a2e]/80 whitespace-nowrap">
                Meridian
              </span>
              <span className="font-['Oswald'] font-medium uppercase text-lg md:text-xl lg:text-2xl text-[#2d3a2e]/80 whitespace-nowrap">
                STELLEX
              </span>
              <span className="font-['Montserrat'] font-bold text-lg md:text-xl lg:text-2xl text-[#2d3a2e]/80 whitespace-nowrap">
                Luminar
              </span>
              <span className="font-['Roboto_Slab'] font-semibold uppercase text-lg md:text-xl lg:text-2xl text-[#2d3a2e]/80 whitespace-nowrap">
                OVERLAND
              </span>
              <span className="font-['Raleway'] font-bold text-lg md:text-xl lg:text-2xl text-[#2d3a2e]/80 whitespace-nowrap">
                Kinetic
              </span>
            </div>
          </div>
        );
      }

      function Hero() {
        return (
          <section className="relative w-full h-screen min-h-[700px] overflow-hidden bg-[#faf8f5]">
            {/* Video layer */}
            <div className="absolute inset-0">
              <video
                src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260820_010308_b1636845-4c15-4ab6-b0c9-9a29bfb0c6e3.mp4"
                autoPlay
                muted
                loop
                playsInline
                className="w-full h-full object-cover object-bottom"
              />
            </div>

            {/* Content column */}
            <div className="relative z-10 flex flex-col items-start max-w-7xl mx-auto pt-28 md:pt-36 px-6 lg:px-8">
              {/* Announcement pill */}
              <a
                href="#announcement"
                className="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-[#2d3a2e]/15 bg-white/60 backdrop-blur-sm hover:bg-white/80 transition-colors mb-5 md:mb-6 animate-fade-up stagger-3"
              >
                <span className="text-sm text-[#2d3a2e]">
                  Live for everyone today! Offering $1MM in credits.
                </span>
                <ArrowRight />
              </a>

              {/* Headline */}
              <h1 className="text-left text-3xl sm:text-4xl md:text-5xl lg:text-6xl text-[#2d3a2e] leading-[1.05] tracking-tight max-w-4xl animate-fade-up stagger-4">
                One unified system to build,
                <br className="hidden sm:block" /> test, ship, and observe LLMs
              </h1>

              {/* Trusted by section */}
              <TrustedBy />
            </div>
          </section>
        );
      }

      function AppMain() {
        const [isScrolled, setIsScrolled] = useState(false);
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

        useEffect(() => {
          const handleScroll = () => {
            setIsScrolled(window.scrollY > 20);
          };

          window.addEventListener('scroll', handleScroll, { passive: true });
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        useEffect(() => {
          if (mobileMenuOpen) {
            document.body.style.overflow = 'hidden';
          } else {
            document.body.style.overflow = '';
          }

          return () => {
            document.body.style.overflow = '';
          };
        }, [mobileMenuOpen]);

        return (
          <div className="w-full min-h-screen bg-[#faf8f5]">
            <Navbar
              isScrolled={isScrolled}
              mobileMenuOpen={mobileMenuOpen}
              setMobileMenuOpen={setMobileMenuOpen}
            />
            <main>
              <Hero />
            </main>
          </div>
        );
      }

      ReactDOM.render(<AppMain />, document.getElementById('root'));
    </script>
  </body>
</html>
